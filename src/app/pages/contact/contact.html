<section class="bg-gray-50 py-16">

  <div class="max-w-6xl mx-auto px-4">

    <!-- Title -->
    <div class="text-center mb-12">

      <h2 class="text-4xl font-bold text-gray-800 title-font">
        Contáctanos
      </h2>

      <div class="w-24 h-1 bg-blue-400 mx-auto mt-4 rounded"></div>

      <p class="mt-6 text-gray-600 max-w-2xl mx-auto">
        Estamos aquí para ayudarte, orar contigo y responder cualquier pregunta.
        Será un placer recibirte en nuestra comunidad.
      </p>

    </div>

    <!-- Content -->
    <div class="grid md:grid-cols-2 gap-10">

      <!-- Contact Info -->
      <div class="bg-white rounded-2xl shadow-lg p-8">

        <h3 class="text-2xl font-semibold text-gray-800 mb-6">
          Información
        </h3>

        <div class="space-y-6">

          <!-- Address -->
          <div class="flex items-start gap-4">

            <div class="bg-indigo-100 p-3 rounded-full">
            <i class="pi pi-map"></i>
            </div>

            <div>
              <h4 class="font-semibold text-gray-800">
                Dirección
              </h4>

              <p class="text-gray-600">
                Avenida Central, Panamá
              </p>
            </div>

          </div>

          <!-- Phone -->
          <div class="flex items-start gap-4">

            <div class="bg-indigo-100 p-3 rounded-full">
              <i class="pi pi-phone"></i>
            </div>

            <div>
              <h4 class="font-semibold text-gray-800">
                Teléfono
              </h4>

              <p class="text-gray-600">
                +507 6000-0000
              </p>
            </div>

          </div>

          <!-- Email -->
          <div class="flex items-start gap-4">

            <div class="bg-indigo-100 p-3 rounded-full">
              <i class="pi pi-envelope"></i>
            </div>

            <div>
              <h4 class="font-semibold text-gray-800">
                Correo
              </h4>

              <p class="text-gray-600">
                contacto@iglesia.com
              </p>
            </div>

          </div>

          <!-- Hours -->
          <div class="flex items-start gap-4">

            <div class="bg-indigo-100 p-3 rounded-full">
              <i class="pi pi-clock"></i>
            </div>

            <div>
              <h4 class="font-semibold text-gray-800">
                Horarios
              </h4>

              <p class="text-gray-600">
                Domingos 9:00 AM y 11:00 AM
              </p>
            </div>

          </div>

        </div>

      </div>

      <!-- Contact Form -->
      <div class="bg-white rounded-2xl shadow-lg p-8">

        <h3 class="text-2xl font-semibold text-gray-800 mb-6">
          Envíanos un mensaje
        </h3>

        <form class="space-y-5">

          <!-- Name -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">
              Nombre
            </label>

            <input
              type="text"
              placeholder="Tu nombre"
              class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:border-indigo-500 focus:ring focus:ring-indigo-200 outline-none"
            >
          </div>

          <!-- Email -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">
              Correo
            </label>

            <input
              type="email"
              placeholder="correo@email.com"
              class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:border-indigo-500 focus:ring focus:ring-indigo-200 outline-none"
            >
          </div>

          <!-- Message -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">
              Mensaje
            </label>

            <textarea
              rows="5"
              placeholder="Escribe tu mensaje..."
              class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:border-indigo-500 focus:ring focus:ring-indigo-200 outline-none"
            ></textarea>
          </div>

          <!-- Button -->
          <button
            type="submit"
            class="w-full rounded-lg bg-blue-400 px-6 py-3 text-white font-semibold hover:bg-blue-500 transition"
          >
            Enviar mensaje
          </button>

        </form>

      </div>

    </div>

  </div>

</section>
